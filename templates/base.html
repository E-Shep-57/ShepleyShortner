<!doctype html>
<html lang="en">
<head>
    {% block head %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    {% block styles %}
    {{ bootstrap.load_css() }}
    <style>
        .main-content {
            margin-top: 50px;
            padding: 30px;
            border: 3px solid #212529;
            border-radius: 0; /* Square edges for that block look */
            box-shadow: 10px 10px 0px #212529;
        }
    </style>
    {% endblock %}

    <title>{% block title %}My Flask App{% endblock %}</title>
    {% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">Shepley-Flask</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('index') }}">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('create_link') }}">Create</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('directory') }}">Directory</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">
        <div class="main-content">
            {% block content %}{% endblock %}
        </div>
    </div>

    {% block scripts %}
    {{ bootstrap.load_js() }}
    {% endblock %}
</body>
</html>
